<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro | Pizzería Laxaruz</title>
</head>
<body>

<h1>Registro de Usuario</h1>

<form th:action="@{/usuario/registro}" th:object="${usuario}" method="post">
    <label>Nombre:</label>
    <input type="text" th:field="*{nombre}" required><br/>

    <label>Dirección:</label>
    <input type="text" th:field="*{direccion}" required><br/>

    <label>Correo electrónico:</label>
    <input type="email" th:field="*{correo}" required><br/>

    <label>Teléfono:</label>
    <input type="text" th:field="*{telefono}" required><br/>

    <label>Contraseña:</label>
    <input type="password" th:field="*{password}" required><br/>

    <button type="submit">Registrar</button>
</form>

<div th:if="${error}">
    <p style="color:red;" th:text="${error}"></p>
</div>

<p>¿Ya tienes cuenta?
    <a th:href="@{/usuario/login}">Inicia sesión aquí</a>
</p>

<hr/>
<div th:insert="fragments/footer :: footer"></div>

</body>
</html>
