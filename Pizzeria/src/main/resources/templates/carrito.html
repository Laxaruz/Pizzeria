<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Carrito de Compras</title>
</head>
<body>

<h1>Tu Carrito de Pizzas</h1>

<nav>
    <a th:href="@{/catalogo}">Seguir comprando</a> |
    <a th:href="@{/carrito/ver}">Actualizar carrito</a> |
    <a th:href="@{/usuario/logout}">Cerrar sesión</a>
</nav>
<hr/>

<!-- Si el carrito está vacío -->
<div th:if="${#lists.isEmpty(carrito)}">
    <p>No hay pizzas en el carrito.</p>
    <p><a th:href="@{/catalogo}">Volver al catálogo</a></p>
</div>

<!-- Si el carrito tiene elementos -->
<div th:unless="${#lists.isEmpty(carrito)}">
    <table border="1">
        <thead>
        <tr>
            <th>#</th>
            <th>Tipo</th>
            <th>Tamaño</th>
            <th>Precio unitario</th>
            <th>Cantidad</th>
            <th>Subtotal</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item, stat : ${carrito}">
            <td th:text="${stat.count}"></td>
            <td th:text="${item.pizza.tipo.nombre}"></td>
            <td th:text="${item.pizza.tamaño.etiqueta}"></td>
            <td th:text="${item.pizza.precio}"></td>
            <td th:text="${item.cantidad}"></td>
            <td th:text="${item.subtotal}"></td>
            <td>
                <form th:action="@{/carrito/eliminar}" method="post" style="display:inline">
                    <input type="hidden" name="index" th:value="${stat.index}" />
                    <button type="submit">Eliminar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <h3>Total: <span th:text="${total}"></span></h3>

    <form th:action="@{/pedido/confirmar}" method="post">
        <button type="submit">Confirmar pedido (Pago contra entrega)</button>
    </form>

    <form th:action="@{/carrito/cancelar}" method="post">
        <button type="submit">Cancelar pedido</button>
    </form>
</div>

<hr/>
<div th:insert="fragments/footer :: footer"></div>

</body>
</html>
